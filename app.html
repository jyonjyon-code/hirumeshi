            { luck: "末吉", food: "ウィダーインゼリー＆バナナ", keyword: "ゼリー飲料", desc: "10秒チャージで午後を乗り切れ！", add: "ミネラルウォーター" }
        ]
    };

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('normal-btn').classList.toggle('active-mode', mode === 'normal');
        document.getElementById('conveni-btn').classList.toggle('active-mode', mode === 'conveni');
        reset();
    }

    function draw() {
        const box = document.getElementById('omikuji-box');
        box.classList.add('shake');

        setTimeout(() => {
            box.classList.remove('shake');
            const list = menus[currentMode];
            const res = list[Math.floor(Math.random() * list.length)];
            
            document.getElementById('luck').innerText = `【${res.luck}】`;
            document.getElementById('food').innerText = res.food;
            document.getElementById('desc').innerText = res.desc;
            document.getElementById('add-on').innerText = res.add;
            
            document.getElementById('map-link').href = `https://www.google.com/maps/search/{encodeURIComponent(res.keyword)}`;

            const adBox = document.getElementById('tabelog-ad-box');
            const dBtn = document.getElementById('uber-link');

            if (currentMode === 'normal') {
                adBox.style.display = 'flex';
                dBtn.style.display = 'none';
            } else {
                adBox.style.display = 'none';
                dBtn.style.display = 'block';
            }

            document.getElementById('result-area').style.display = 'block';
            document.getElementById('main-view').style.display = 'none';
            document.getElementById('copy-btn').innerHTML = '<i class="fas fa-copy"></i> 結果をコピー';
        }, 800);
    }

    function shareX() {
        const luck = document.getElementById('luck').innerText;
        const food = document.getElementById('food').innerText;
        const addOn = document.getElementById('add-on').innerText;
        const text = `今日のひるめしは…\n${luck}！「${food}」に決まり！\n✨ラッキー買い足し: ${addOn}\n\n#ひるめしえらんで #ねこたスタジオ #ランチ`;
        const url = `https://x.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(location.href)}`;
        window.open(url, '_blank');
    }

    function copyResult() {
        const luck = document.getElementById('luck').innerText;
        const food = document.getElementById('food').innerText;
        const addOn = document.getElementById('add-on').innerText;
        const shareText = `今日のひるめしは【${luck}】${food}！✨ラッキー買い足し：${addOn}\n${location.href}`;
        
        navigator.clipboard.writeText(shareText).then(() => {
            const btn = document.getElementById('copy-btn');
            btn.innerHTML = '<i class="fas fa-check"></i> コピー完了！';
            setTimeout(() => {
                btn.innerHTML = '<i class="fas fa-copy"></i> 結果をコピー';
            }, 2000);
        });
    }

    function reset() {
        document.getElementById('result-area').style.display = 'none';
        document.getElementById('main-view').style.display = 'block';
        document.getElementById('omikuji-box').innerText = currentMode === 'normal' ? "🍱" : "🏪";
    }
</script>
</body>
</html>
