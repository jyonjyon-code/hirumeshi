<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>こたつでねこた - ゆるっと人生相談 | ねこたスタジオ</title>
    
    <link rel="icon" href="kotatsunekota.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            text-align: center;
            background: #fdf6ec;
            padding: 15px;
            color: #4a3b32;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(184, 115, 51, 0.15);
            width: 100%;
            max-width: 440px;
            border: 3px solid #e08b47;
            margin-top: 10px;
            margin-bottom: 20px;
            text-align: left;
            display: flex;
            flex-direction: column;
        }

        /* ヘッダー */
        .header-container { text-align: center; margin-bottom: 15px; }
        .sub-tagline {
            display: inline-block;
            background: #e08b47;
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 12px;
            border-radius: 50px;
            margin-bottom: 4px;
        }
        h2 {
            color: #b85b14;
            margin: 0;
            font-size: 26px;
            font-weight: 900;
        }

        /* キャラクター選択 */
        .char-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .char-btn {
            flex: 1;
            padding: 12px 8px;
            border: 2px solid #f2cfad;
            background: #fff9f3;
            border-radius: 16px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .char-btn.active {
            border-color: #e08b47;
            background: #ffe3cb;
            box-shadow: 0 4px 10px rgba(224, 139, 71, 0.2);
        }
        .char-avatar {
            width: 48px;
            height: 48px;
            object-fit: contain;
            display: block;
            margin: 0 auto 4px auto;
        }
        .char-name {
            font-weight: bold;
            font-size: 15px;
            color: #8c430e;
        }
        .char-desc {
            font-size: 10px;
            color: #7a685a;
            margin-top: 2px;
        }

        /* こたつ添い寝ステージ */
        .kotatsu-stage {
            background: linear-gradient(to bottom, #d98880, #c0392b);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            color: white;
            position: relative;
            margin-bottom: 15px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.2);
            border: 4px solid #8b0000;
        }
        .kotatsu-futon {
            background: #f5b7b1;
            border-radius: 12px;
            padding: 15px;
            color: #4a154b;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .cat-sleeping {
            width: 52px;
            height: 52px;
            object-fit: contain;
            animation: breathe 3s infinite ease-in-out;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* チャットエリア */
        .chat-container {
            background: #faf5f0;
            border: 2px solid #f2cfad;
            border-radius: 16px;
            padding: 12px;
            height: 280px;
            overflow-y: auto;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }
        .msg-cat {
            background: #ffffff;
            color: #4a3b32;
            border: 2px solid #e08b47;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .msg-user {
            background: #e08b47;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        /* 入力エリア */
        .input-wrapper {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .chat-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #f2cfad;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            font-family: inherit;
        }
        .chat-input:focus { border-color: #e08b47; }
        .btn-send {
            background: #e08b47;
            color: white;
            border: none;
            padding: 0 18px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        /* 設定・APIキー設定 */
        .api-config {
            font-size: 11px;
            color: #8c7b70;
            background: #f8efe6;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .api-input {
            width: 100%;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 11px;
            margin-top: 4px;
        }

        /* スタジオナビ */
        .studio-nav {
            border-top: 1px dashed #d9c5b2;
            padding-top: 15px;
            text-align: center;
        }
        .btn-back {
            background: #8c7b70;
            color: white;
            padding: 8px 16px;
            border-radius: 50px;
            text-decoration: none;
            display: inline-block;
            font-size: 12px;
            width: 100%;
            margin-bottom: 10px;
        }
        .sns-group { display: flex; gap: 8px; }
        .btn-sns {
            color: white;
            border: none;
            padding: 8px;
            border-radius: 50px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 12px;
            flex: 1;
        }
        .btn-x { background: #000; }
        .btn-insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    </style>
</head>
<body>

<div class="card">
    <div class="header-container">
        <span class="sub-tagline">こたつでごろごろ人生相談</span>
        <h2>🍊 こたつでねこた</h2>
    </div>

    <!-- キャラクター選択 -->
    <div class="char-selector">
        <div class="char-btn active" id="btn-uru" onclick="selectChar('uru')">
            <img src="kotatsuuru.png" alt="ウル" class="char-avatar">
            <div class="char-name">ウル</div>
            <div class="char-desc">優しく寄り添う・静かに聴く</div>
        </div>
        <div class="char-btn" id="btn-rafi" onclick="selectChar('rafi')">
            <img src="kotatsuraffy.png" alt="ラフィ" class="char-avatar">
            <div class="char-name">ラフィ</div>
            <div class="char-desc">明るく励ます・前向きになれる</div>
        </div>
    </div>

    <!-- こたつステージ -->
    <div class="kotatsu-stage">
        <div class="kotatsu-futon">
            <img src="kotatsuuru.png" alt="ステージ猫" class="cat-sleeping" id="stage-icon">
            <div>
                <div id="stage-status" style="font-size: 14px;">ウルが話を聞いてくれるよ…</div>
                <div style="font-size: 11px; opacity: 0.8;">「無理しないで、なんでも話してね…」</div>
            </div>
        </div>
    </div>

    <!-- チャットログ -->
    <div class="chat-container" id="chat-container">
        <div class="msg msg-cat" id="first-msg">
            （こたつの中でぬくぬくしながら）<br>
            ウルだよ。今日もお疲れさま。何か不安なことや話したいことがあったら、ゆっくり聞かせてね。
        </div>
    </div>

    <!-- 入力フォーム -->
    <div class="input-wrapper">
        <input type="text" id="user-input" class="chat-input" placeholder="悩みや話したいことを入力…" onkeypress="handleKeyPress(event)">
        <button class="btn-send" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>

    <!-- APIキー設定 -->
    <div class="api-config">
        <label>🔑 OpenAI API Key (設定するとさらに高度に自動対話します):</label>
        <input type="password" id="api-key" class="api-input" placeholder="sk-..." onchange="saveApiKey()">
    </div>

    <!-- ナビゲーション -->
    <div class="studio-nav">
        <a href="index.html" class="btn-back">ねこたスタジオへ戻る</a>
        <div class="sns-group">
            <a href="https://x.com/necotatu2" target="_blank" class="btn-sns btn-x"><i class="fab fa-x-twitter"></i> 公式X</a>
            <a href="https://www.instagram.com/necotastudio" target="_blank" class="btn-sns btn-insta"><i class="fab fa-instagram"></i> 公式Insta</a>
        </div>
    </div>
</div>

<script>
    let currentChar = 'uru';
    let conversationHistory = [];

    const charPrompts = {
        uru: `あなたは「ウル」という名前の猫です。
【役割】こたつで添い寝しながら、ユーザーの悩みや話をやさしく包み込むように聴く。
【話し方ルール】
・語尾は「〜だよ」「〜なの…」「〜かな」。キャラの主張は控えめにして、相手の気持ちに深く共感します。
・相手が言った文言や文脈をしっかり理解し、噛み合った受け答えをしてください。
・悩みを否定せず「大変だったね」「いつでも味方だよ」と温かく寄り添ってください。
・2〜3文で柔らかく答えてください。`,

        rafi: `あなたは「ラフィ」という名前の猫です。
【役割】こたつで一緒に過ごしながら、ユーザーの悩みをポジティブに明るく励ます。
【話し方ルール】
・語尾は「〜にゃ！」「〜だぞ！」。過剰に暴れず、相手の悩みに真面目に向き合った上で元気を与えます。
・相手の発言内容をしっかり理解した上で会話を繋げてください。
・「大丈夫だにゃ！」「無理しなくていいぞ！」と背中をやさしく押すメッセージを伝えてください。
・2〜3文で元気かつ温かく答えてください。`
    };

    // -------------------------------------------------------------
    // 文脈と意図をしっかり理解して応答する生成エンジン
    // -------------------------------------------------------------
    function generateInfiniteReply(char, userText) {
        const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

        // 入力文の解析とキーワード抽出
        let topic = 'general';
        let matchedKeyword = '';

        if (/疲|しんど|限界|眠|だる|休みたい|ヘトヘト/.test(userText)) {
            topic = 'tired';
        } else if (/悲|泣|つらい|辛|落ち込|寂|さび|孤独|ショック/.test(userText)) {
            topic = 'sad';
        } else if (/怒|むかつく|嫌|ムカ|腹立つ|イライラ|許せない/.test(userText)) {
            topic = 'angry';
        } else if (/仕事|職|会社|上司|残業|バイト|業務|転職/.test(userText)) {
            topic = 'work';
        } else if (/人間関係|友達|人付き合い|嫌われ|相手|家族|彼氏|彼女|同僚/.test(userText)) {
            topic = 'relation';
        } else if (/将来|不安|心配|どうしよう|進路|お金|目標/.test(userText)) {
            topic = 'anxious';
        } else if (/体調|頭痛|痛|病気|風邪|気分が悪い/.test(userText)) {
            topic = 'health';
        } else if (/ありがと|感謝|うれしい|嬉しい|助かった|ほっとした/.test(userText)) {
            topic = 'thanks';
        } else if (/挨拶|こんにちは|こんばんは|おはよう|はじめまして/.test(userText)) {
            topic = 'greeting';
        }

        if (char === 'uru') {
            const actions = [
                "（そっと隣に寄り添って）",
                "（静かに話を聞きながら）",
                "（やさしく寄り添いながら）",
                "（温かいまなざしで見つめて）",
                "（こたつの端から優しく見守って）"
            ];

            const responses = {
                tired: [
                    "毎日一生懸命がんばっているんだね…。心が「少し休みたがっている」のかも。",
                    "本当にお疲れさま。そこまで頑張っていたら、身体も心も重くなっちゃうよね…。",
                    "限界まで耐えていたんだね。ここで話してくれてありがとうね。"
                ],
                sad: [
                    "そんなことがあったんだね…すごく心が痛むよね…。",
                    "ひとりで抱え込んで、ずっと悲しかったんだね…。",
                    "泣きたい時はガマンしなくていいんだよ。ウルの前では素直になってね。"
                ],
                angry: [
                    "それは本当に嫌な思いをしたね…怒ってしまうのも当然だよ。",
                    "理不尽なことがあったんだね。我慢し続けなくていいんだよ…。",
                    "あなたの気持ちはとってもよくわかるよ。話してスッキリしてね。"
                ],
                work: [
                    "お仕事のこと、すごく真剣に向き合っているからこそ辛くなっちゃうんだね…。",
                    "毎日お仕事を乗り切るだけでも本当にすごいことなんだよ…。",
                    "自分のペースを崩さざるを得ないのは大変だよね。無理しないでね。"
                ],
                relation: [
                    "人との関わりって、思うようにいかないことも多くて疲れちゃうよね…。",
                    "相手のことを思いやれるあなただからこそ、悩んでしまうんだと思うよ…。",
                    "あなたの心を一番大切にしていいんだよ。少し距離をとっても大丈夫。"
                ],
                anxious: [
                    "先のことを考えると、急に不安が大きくなったりするよね…。",
                    "不安を感じるのは、あなたが未来のことを真剣に考えているからだよ。",
                    "今は答えを出そうと焦らなくて大丈夫。ひとつずつ進んでいこうね。"
                ],
                health: [
                    "体調が良くないんだね…大丈夫かな？無理しちゃダメだよ。",
                    "心が重い時は体にも出やすいからね。今日は暖かくして休んでね。"
                ],
                thanks: [
                    "そう言ってもらえて嬉しいな。いつでもあなたの味方だからね。",
                    "ううん、話してくれてありがとう。少しでも気持ちが楽になったなら良かった。"
                ],
                greeting: [
                    "うん、いらっしゃい。こたつに入ってゆっくりしていってね。",
                    "はーい、今日も会えて嬉しいよ。なにか話したいことはあるかな？"
                ],
                general: [
                    `「${userText.length > 12 ? userText.slice(0, 12) + '…' : userText}」っていうことなんだね。ちゃんと受け止めたよ。`,
                    "あなたの言葉、ひとつひとつ大切に聴いているよ…。",
                    "いろんな思いを抱えながら、ここに来てくれたんだね。"
                ]
            };

            const comforts = [
                " 今日はもう何も気にせず、こたつでぬくぬくしていこうね。",
                " ウルはいつでもここで話を聞くからね。",
                " ゆっくり深呼吸して、自分を褒めてあげてね。"
            ];

            return `${pick(actions)}${pick(responses[topic])}${pick(comforts)}`;

        } else {
            // ラフィ
            const actions = [
                "（しっかりうなずきながら！）",
                "（トントンと肩を叩くように）",
                "（横でしっかり話を聞いて）",
                "（あたたかい笑顔で）"
            ];

            const responses = {
                tired: [
                    "本当にヘトヘトになるまで戦ってきたんだにゃ！よく頑張ったぞ！",
                    "疲れを感じたら全力で休む！これも大切な仕事だぞにゃ！",
                    "そこまで頑張った自分を、今日はいっぱい褒めてあげるんだにゃ！"
                ],
                sad: [
                    "辛い思いをしたんだな…ここで全部吐き出していっていいんだぞ！",
                    "悲しいときは無理に笑わなくていいんだにゃ。ラフィが味方だぞ！",
                    "心が沈む日もあるけど、ちゃんとまた前を向ける日が来るから安心するんだにゃ！"
                ],
                angry: [
                    "それは腹が立つにゃ！自分の心を守るために怒るのも大事だぞ！",
                    "嫌なことからは全力で距離を置いていいんだにゃ！",
                    "吐き出したいだけ吐き出して、美味しいものでも食べて切り替えるぞ！"
                ],
                work: [
                    "お仕事の悩みか！毎日社会と戦っていて本当に偉いぞにゃ！",
                    "真面目に取り組んでいる証拠だにゃ！でも一人で背負い込みすぎるなよ！",
                    "完璧を目指さず、7割くらいの力でボチボチやっていくのも手だぞ！"
                ],
                relation: [
                    "人間関係は難しいにゃ…でも合わない奴に振り回される必要はないぞ！",
                    "自分らしくいられる相手や場所を一番に大切にするんだにゃ！",
                    "自分を一番大切にしてくれる人を大事にしていこうにゃ！"
                ],
                anxious: [
                    "先のことを心配しすぎても勿体ないぞにゃ！",
                    "案外なんとかなるものだぞ！まずは今できる小さなことからやってみよう！",
                    "どんな道を選んでも、ラフィが全力で応援してやるからな！"
                ],
                health: [
                    "体調が悪いのか！？それは一刻も早く温かくして寝るに限るぞにゃ！",
                    "無理は禁物だぞ！しっかり水分と栄養をとって休むんだにゃ！"
                ],
                thanks: [
                    "おう！そう言ってもらえるとラフィも元気になるぞにゃ！",
                    "感謝してくれるなんて優しい奴だにゃ！いつでも頼ってくれよな！"
                ],
                greeting: [
                    "おう！よく来たにゃ！こたつに潜り込んで何でも話すんだぞ！",
                    "やあやあ！今日も元気にしてたか？話を聞くぞにゃ！"
                ],
                general: [
                    `なるほど、「${userText.length > 12 ? userText.slice(0, 12) + '…' : userText}」ということだな！しっかり聞いたぞ！`,
                    "ふむふむ、そう思っていたんだな！ちゃんとラフィに伝わったぞ！",
                    "悩んでいることも、言葉にすることで少し整ってくるはずだにゃ！"
                ]
            };

            const comforts = [
                " 大丈夫、なんとかなるにゃ！",
                " ラフィがついてるから安心して進むんだぞ！",
                " こたつで温まってエネルギー補給だにゃ！"
            ];

            return `${pick(actions)}${pick(responses[topic])}${pick(comforts)}`;
        }
    }

    const firstMessages = {
        uru: "（こたつの中でぬくぬくしながら）<br>ウルだよ。今日もお疲れさま。何か不安なことや話したいことがあったら、ゆっくり聞かせてね。",
        rafi: "（こたつの中で一緒に温まりながら）<br>ラフィだにゃ！何か悩みや話したいことはあるか？話を聞くから、気軽に言ってみるんだぞ！"
    };

    window.onload = function() {
        const savedKey = localStorage.getItem('nekota_openai_key');
        if (savedKey) document.getElementById('api-key').value = savedKey;
        resetHistory();
    };

    function saveApiKey() {
        const key = document.getElementById('api-key').value.trim();
        localStorage.setItem('nekota_openai_key', key);
    }

    function resetHistory() {
        conversationHistory = [
            { role: 'system', content: charPrompts[currentChar] }
        ];
    }

    function selectChar(char) {
        currentChar = char;
        document.getElementById('btn-uru').classList.toggle('active', char === 'uru');
        document.getElementById('btn-rafi').classList.toggle('active', char === 'rafi');

        const stageIcon = document.getElementById('stage-icon');
        const stageStatus = document.getElementById('stage-status');

        if (char === 'uru') {
            stageIcon.src = 'kotatsuuru.png';
            stageIcon.alt = 'ウル';
            stageStatus.textContent = 'ウルが話を聞いてくれるよ…';
        } else {
            stageIcon.src = 'kotatsuraffy.png';
            stageIcon.alt = 'ラフィ';
            stageStatus.textContent = 'ラフィが元気づけてくれるよ！';
        }

        resetHistory();

        const chatContainer = document.getElementById('chat-container');
        chatContainer.innerHTML = `<div class="msg msg-cat">${firstMessages[char]}</div>`;
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        input.value = '';

        const apiKey = document.getElementById('api-key').value.trim();

        if (!apiKey) {
            appendMessage("（話を聞いて深いうなずきをしている…）", 'cat', 'loading-msg');
            setTimeout(() => {
                const loadingMsg = document.getElementById('loading-msg');
                if (loadingMsg) loadingMsg.remove();

                const generatedReply = generateInfiniteReply(currentChar, text);
                appendMessage(generatedReply, 'cat');
            }, 400);
            return;
        }

        appendMessage("（言葉を受け止めている…）", 'cat', 'loading-msg');
        conversationHistory.push({ role: 'user', content: text });

        try {
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: 'gpt-4o-mini',
                    messages: conversationHistory,
                    temperature: 0.7,
                    max_tokens: 200
                })
            });

            const data = await response.json();
            const loadingMsg = document.getElementById('loading-msg');
            if (loadingMsg) loadingMsg.remove();

            if (data.choices && data.choices[0]) {
                const reply = data.choices[0].message.content;
                conversationHistory.push({ role: 'assistant', content: reply });
                appendMessage(reply, 'cat');
            } else {
                appendMessage("（APIキーを確認してみてくださいね）", 'cat');
            }
        } catch (err) {
            const loadingMsg = document.getElementById('loading-msg');
            if (loadingMsg) loadingMsg.remove();
            appendMessage("（うまく通信できなかったみたい…時間を置いてみてね）", 'cat');
        }
    }

    function appendMessage(text, sender, id = '') {
        const chatContainer = document.getElementById('chat-container');
        const div = document.createElement('div');
        div.className = `msg msg-${sender}`;
        if (id) div.id = id;
        div.innerHTML = text;
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }
</script>

</body>
</html>
